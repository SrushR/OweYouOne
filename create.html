<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Room</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="createroom.css">
</head>
<body>

  <section class="container">

    <form class="roomform">


      <h1>&#127968 Create Your Room</h1>

      <p class="subtitle">
        Manage expenses, duties and groceries easily with your roommates.
      </p>

      <!-- ROOM DETAILS -->

      <h2 class="sectiontitle">
        &#127968 Room Details
      </h2>

      <section class="inputbox">

        <label>Room Name</label>

        <input type="text" placeholder="Enter room name">

      </section>

      <section class="inputbox">

        <label>Room Number</label>

        <input type="text" placeholder="Flat 402">

      </section>

      <section class="inputbox">

        <label>City</label>

        <input type="text" placeholder="Enter city">

      </section>

    

      <h2 class="sectiontitle">
       Roommates
      </h2>

      <section class="inputbox">

        <label>Number of Roommates</label>

        <input type="number" placeholder="Enter number">

      </section>

    

      <h2 class="sectiontitle">
         Budget Setup
      </h2>

      <section class="inputbox">

        <label>Monthly Budget</label>

        <input type="number" placeholder="₹15000">

      </section>

  

      <h2 class="sectiontitle">
         Duty Settings
      </h2>

      <section class="inputbox">

        <label>Duty Rotation</label>

        <select>

          <option>Enable</option>

          <option>Disable</option>

        </select>

      </section>

  

      <h2 class="sectiontitle">
         Notifications
      </h2>

      <section class="inputbox">

        <label>Enable Notifications</label>

        <select>

          <option>Enable</option>

          <option>Disable</option>

        </select>

      </section>

    

      <button type="submit" class="btn">
        Create Room 
      </button>

    </form>

  </section>

</body>
</html>
